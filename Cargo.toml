[package]
name = "ricepilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Atomically switch a Linux desktop between complete rice profiles by re-pointing directory symlinks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/S3-R4/ricepilot"
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "deny"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
inquire = "0.9.4"
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["yaml"] }
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
